<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final FES Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <section id="landing">
      <nav class="nav">
        <div class="row nav__row">
          <div class="nav__title">
            <img
              class="nav__logo--img"
              src="./assets/treact-logo.svg"
              alt="Treact Logo"
            />
            <div class="nav__logo--title">Treact</div>
          </div>
          <div class="nav__links">
            <a href="#" class="nav__link">About</a>
            <a href="#" class="nav__link">Blog</a>
            <a href="#" class="nav__link">Pricing</a>
            <a href="#" class="nav__link">Contact Us</a>
            <a href="#" class="nav__link login">Login</a>
            <a href="#" class="nav__link sign__up">Sign Up</a>
          </div>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row header">
            <div class="header__txt">
              <h1 class="header__title">
                Beautiful React Templates <span class="purple">for you.</span>
              </h1>
              <div class="header__des">
                <p>
                  Our templates are easy to setup, understand and customize.
                  Fully modular components with a variety of pages and
                  components.
                </p>
              </div>
              <div class="email__hub">
                <form class="email">
                  <input type="email" placeholder="Your E-mail Address" />
                  <button>Get Started</button>
                </form>
                <div class="header__comp">
                  <p>Our Trusted Customers</p>
                  <img
                    src="./assets/customers-logo.png"
                    class="header__comp--logos"
                    alt="Fortune, The Weather Channel, Fast Company, National Geographic"
                  />
                </div>
              </div>
            </div>
            <div class="header__img">
              <figure class="header__img--wrapper">
                <img
                  src="./assets/design-illustration.svg"
                  alt="Design Illustration"
                />
              </figure>
            </div>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
